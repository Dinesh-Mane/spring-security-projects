spring:
  application:
    name: ${APP_NAME:spring-security-project}

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_SCHEMA:spring-security-db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

#  using static user creds as of now
  security:
    user:
      name: ${SECURITY_USERNAME:root}
      password: ${SECURITY_PASSWORD:root}

  jpa:
    hibernate:
      ddl-auto: update
